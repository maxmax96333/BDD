name: Java CI with Gradle

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Start SUT and wait for readiness
        run: |
          java -jar ./artifacts/app-replan-delivery.jar > sut.log 2>&1 &
          echo $! > sut.pid

          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:9999/ >/dev/null; then
              echo "SUT is ready"
              exit 0
            fi

            if ! kill -0 "$(cat sut.pid)" 2>/dev/null; then
              cat sut.log
              exit 1
            fi

            sleep 1
          done

          cat sut.log
          echo "SUT did not become ready on port 9999"
          exit 1

      - name: Start Selenium Grid with Chrome
        run: |
          docker run -d \
            --name selenium-grid \
            --network host \
            --shm-size=2g \
            selenium/standalone-chrome:4.48.0-20260905

          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4444/status | jq -e '.value.ready == true' >/dev/null; then
              echo "Selenium Grid is ready"
              exit 0
            fi
            sleep 1
          done

          docker logs selenium-grid
          echo "Selenium Grid did not become ready"
          exit 1

      - name: Build with Gradle
        run: ./gradlew test --info -Dselenide.headless=true -Dselenide.remote=http://localhost:4444

      - name: Show logs on failure
        if: failure()
        run: |
          cat sut.log || true
          docker logs selenium-grid || true

      - name: Stop Selenium Grid
        if: always()
        run: docker rm -f selenium-grid || true